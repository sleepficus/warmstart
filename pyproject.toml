[project]
name = "warmstart"
version = "0.2.0"
description = "Local, network-free repository knowledge compiler for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["coding-agents", "agents-md", "repository-knowledge", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.6",
]

[project.urls]
Homepage = "https://misfitcircuit.com/labs/warmstart/"
Repository = "https://github.com/sleepficus/warmstart"
Issues = "https://github.com/sleepficus/warmstart/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
warmstart = "warmstart.cli:app"
coldstart = "warmstart.cli:app"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "README.md",
    "MIGRATION.md",
    "NOTICE.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "DCO.md",
    "LICENSE",
    "RELEASE-CHECKLIST.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coldstart", "src/warmstart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
